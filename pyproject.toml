[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jq-framework"
version = "0.1.0"
description = "面向 A 股与期货的量化研究框架：数据 → 因子 → 组合 → 回测 → 信号"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "acelyb" }]
keywords = ["quant", "futures", "cta", "backtest", "factor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
# 数据源（联网拉取行情时才需要）
data = [
    "akshare>=1.12.0",
]
# 单标的回测适配层
backtrader = [
    "backtrader>=1.9.78",
]
# 机器学习路径
ml = [
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/acelyb/junior-quant"
Repository = "https://github.com/acelyb/junior-quant"

[tool.setuptools.packages.find]
include = ["jq_framework*"]
exclude = ["tests*", "scripts*", "verifications*", "private*"]
